<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR Attendance System</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="container">
  <h1>QR + Face + Location Attendance</h1>
  <p class="subtitle">Anti-proxy attendance register for classrooms</p>

  <div class="card">
    <h3>I am a Teacher</h3>
    <p style="font-size:13px;color:#666;">Start a session and display a rotating QR code for your class.</p>
    <a href="teacher.html"><button>Teacher Dashboard</button></a>
  </div>

  <div class="card">
    <h3>I am a Student</h3>
    <p style="font-size:13px;color:#666;">Enroll your face once, then scan the QR code to mark attendance.</p>
    <a href="enroll.html"><button class="secondary">Enroll / Register</button></a>
    <a href="student.html"><button>Mark Attendance</button></a>
  </div>
</div>
</body>
</html>
